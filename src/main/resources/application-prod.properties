spring.application.name=ecom-product
spring.main.web-application-type=reactive

db.url=ecom-product-mysql-lb
db.port=33062

spring.r2dbc.url=r2dbc:mysql://${db.url}:${db.port}/product
spring.r2dbc.username=ENC(DJtRk7ioindHBJ9ojbazsL/p4e3SIN6ICGi0G8Wmnyqzrtgg66iKh6Q3G3VS60Xo)
